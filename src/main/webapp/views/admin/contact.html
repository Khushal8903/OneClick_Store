<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="../../css/header-footer.css">
    <link rel="stylesheet" href="../../css/contact.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- HEADER -->
    <header class="main-header">
        <a class="logo" href="../index.html">One-Click-Store</a>
        <nav>
            <a href="../user/userReg.html">Registration</a>
                            <a class="dropdown-toggle" role="button" id="dropdownMenuLink"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    Login
                </a>
                <ul class="dropdown-menu" aria-labelledby="dropdownMenuLink">
                    <li><a class="dropdown-item text-dark" href="../user/userlogin.html">Customer</a></li>
                    <li><a class="dropdown-item text-dark" href="adminLogin.html">Admin</a></li>
                </ul>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <!-- CONTACT SECTION -->

    <section class="contact-container">

        <!-- LEFT SIDE -->

        <div class="contact-info col-12-sm">

            <h2>
                Contact Information
            </h2>
            <p>
                Feel free to contact us for any
                product inquiry, support, or order issue.
            </p>
            <div class="info-container">
                <div class="info-box col-12-sm">
                    <h3>
                        Address
                    </h3>

                    <p>
                        Pune, Maharashtra, India
                    </p>
                    <h3>
                        Phone
                    </h3>

                    <p>
                        +91 9876543210
                    </p>
                    <h3>
                        Email
                    </h3>
                    <p>
                        support@ecommerce.com
                    </p>
                </div>
                <img class="col-12-sm" src="../../images/dmart.webp" alt="dmart">
            </div>
            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d30271.082608704684!2d73.77278591424269!3d18.488852807857132!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2bf9ec7efff6d%3A0xa6b851f01122aad2!2sD-Mart%2C%20Karve%20Nagar!5e0!3m2!1sen!2sin!4v1778678634583!5m2!1sen!2sin"
                    allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>

        <!-- RIGHT SIDE -->

        <div class="contact-form p-5">

            <h2>
                Send Message
            </h2>

            <form action="#" method="post">

                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input type="text" id="name" name="name" placeholder="Enter Full Name" required>

                </div>

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email" id="email" name="email" placeholder="Enter Email" required>

                </div>

                <!-- SUBJECT -->

                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <input type="text" id="subject" name="subject" placeholder="Enter Subject" required>

                </div>

                <!-- MESSAGE -->

                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea id="message" name="message" rows="3" placeholder="Enter Your Message" required></textarea>

                </div>

                <!-- BUTTON -->

                <button type="submit" class="btn btn-primary">

                    Send Message

                </button>

            </form>

        </div>

    </section>

    <!-- FOOTER -->

    <footer class="main-footer">

        <p>
            © 2026 E-Commerce Website
        </p>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
