<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>
    <link rel="stylesheet" href="header-footer.css">
    <link rel="stylesheet" href="contact.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <!-- HEADER -->
    <header class="main-header">
        <h1>One Click Store</h1>
        <nav>
            <a href="registration.html">Registration</a>
            <a href="login.html">Login</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- CONTACT SECTION -->

    <section class="contact-container">

        <!-- LEFT SIDE -->

        <div class="contact-info">

            <h2>
                Contact Information
            </h2>

            <p>
                Feel free to contact us for any
                product inquiry, support, or order issue.
            </p>

            <div class="info-box">

                <h3>
                    Address
                </h3>

                <p>
                    Pune, Maharashtra, India
                </p>

            </div>

            <div class="info-box">

                <h3>
                    Phone
                </h3>

                <p>
                    +91 9876543210
                </p>

            </div>

            <div class="info-box">

                <h3>
                    Email
                </h3>

                <p>
                    support@ecommerce.com
                </p>

            </div>

        </div>

        <!-- RIGHT SIDE -->

        <div class="contact-form p-4 card">

            <h2>
                Send Message
            </h2>

            <form action="#" method="post">

                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input type="text" id="name" name="name" placeholder="Enter Full Name" required>

                </div>

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email" id="email" name="email" placeholder="Enter Email" required>

                </div>

                <!-- SUBJECT -->

                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <input type="text" id="subject" name="subject" placeholder="Enter Subject" required>

                </div>

                <!-- MESSAGE -->

                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea id="message" name="message" rows="3" placeholder="Enter Your Message" required></textarea>

                </div>

                <!-- BUTTON -->

                <button type="submit" class="btn btn-primary">

                    Send Message

                </button>

            </form>

        </div>
        
    </section>

    <!-- FOOTER -->

    <footer class="footer">

        <p>
            © 2026 E-Commerce Website
        </p>

    </footer>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
