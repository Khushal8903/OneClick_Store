<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product</title>
<link rel="stylesheet" href="../../css/header-footer.css">
<link rel="stylesheet" href="../../css/adminpane.css">
<link rel="stylesheet" href="../../css/registration.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <div class="sidebar">
        <h2 class="logo">Admin Panel</h2>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="../admin/dashboard.html">Dashboard</a></li>
            <li><a class="active" href="../product/addProduct.html">Add Product</a></li>
            <li><a href="../product/manageProduct.html">Manage Product</a></li>
            <li><a  href="../orders/orders.html">Orders</a></li>
            <li><a href="../user/customer.html">Customers</a></li>
            <li><a href="../orders/shiping.html">Shipment</a></li>
        </ul>
    </div>
<div class="main-content">

    <div class="header">    
        <h1>Add Product</h1>
    </div>

    <div class="card container">
        <form class="form-container">
            <div class="input-group">
                <label>Product Name</label>
                <input type="text" name="pname" value="">
            </div>
            <div class="input-group">
                <label>Img Url</label>
                <input type="text" name="purl" value="">
            </div>
            <div class="input-group">
                <label>Brand</label>
                <input type="text" name="pbrand" value="">
            </div>

            <div class="input-group">
                <label>Description</label>
                <textarea rows="3" name="pdesc" value=""></textarea>
            </div>
            

            <div class="input-group">
                <label>Price</label>
                <input type="number" name="pprice" value="">
            </div>

            <div class="input-group">
                <label>Stock</label>
                <input type="number" name="pstock" value="">
            </div>

            <div class="input-group">
                <label>Category</label>
                <select name="category">
                    <option value="">Select one Category</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Grocery">Grocery</option>
                </select>
            </div>

             <div class="d-grid gap-2 col-6 mx-auto">
                <button class="btn center btn-primary btn-sm" type="submit">Add Product</button>
            </div>

        </form>

    </div>

</div>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
